name: Problema
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu?
      description: Conte o que você tentou fazer e o que viu na tela.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir
      placeholder: "1. Entrei em... 2. Cliquei em... 3. Apareceu..."
  - type: input
    id: pagina
    attributes:
      label: Página (endereço)
      placeholder: /painel
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e navegador
      placeholder: Android, Chrome
  - type: markdown
    attributes:
      value: Não cole senhas, chaves nem dados pessoais de ninguém.
