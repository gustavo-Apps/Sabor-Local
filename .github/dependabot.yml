# Atualizações automáticas de dependências (PRs semanais, no máximo 5 abertos por vez).
version: 2
updates:
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
