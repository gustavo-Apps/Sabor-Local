name: CI

# Roda a cada pull request e a cada push na main.
# O job "CI OK" no final é o que deve ser exigido na proteção de branch:
# ele só passa se qualidade E integração passarem.

on:
  pull_request:
  push:
    branches: [main]

# Um novo push no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: webapp

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Rápido (~2 min): lint, tipos, testes unitários e build. Não precisa de banco.
  # ---------------------------------------------------------------------------
  qualidade:
    name: Lint, tipos, unitários e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` gera PageProps/LayoutProps; sem isso o tsc falha num checkout limpo
      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários (validações e máscaras)
        run: npm run test:unit

      - name: Build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # Completo (~6 min): sobe o Supabase local (aplica TODAS as migrations do zero
  # e o seed) e roda API/RLS/Storage, força bruta e rotas HTTP do Next.
  # ---------------------------------------------------------------------------
  integracao:
    name: Integração (Supabase local + app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      # Falha aqui = alguma migration não aplica num banco novo
      - name: Subir Supabase local (migrations + seed)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Configurar variáveis do app a partir do Supabase local
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3055"
          } > .env.local

      - name: Testes de API (validação no banco, RLS, Storage, RPCs)
        run: npm run test:api

      - name: Testes de força bruta e inundação
        run: npm run test:forca-bruta

      - name: Build e subida do app
        run: |
          npm run build
          nohup npx next start -p 3055 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3055/robots.txt > /dev/null && exit 0
            sleep 1
          done
          echo "O app não subiu em 60 s"; cat next.log; exit 1

      - name: Testes das rotas HTTP
        run: npm run test:http
        env:
          TEST_BASE_URL: http://localhost:3055

      - name: Logs para diagnóstico (só em falha)
        if: failure()
        run: |
          echo "=== next.log ==="; cat next.log 2>/dev/null || true
          echo "=== supabase status ==="; npx supabase status || true
          for c in $(docker ps --format '{{.Names}}'); do
            echo "=== $c ==="; docker logs --tail 80 "$c" 2>&1 || true
          done

      - name: Parar Supabase
        if: always()
        run: npx supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Porta única para a proteção de branch: exija somente "CI OK".
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [qualidade, integracao]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verificar resultado dos jobs
        run: |
          echo "qualidade:  ${{ needs.qualidade.result }}"
          echo "integracao: ${{ needs.integracao.result }}"
          [ "${{ needs.qualidade.result }}" = "success" ] && [ "${{ needs.integracao.result }}" = "success" ]
